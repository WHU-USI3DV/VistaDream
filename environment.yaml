name: vdplus
channels:
  - nvidia
  - conda-forge
dependencies:
  # Keep the CUDA/PyTorch ABI aligned with the RTX 5090, gsplat, and torch-cluster.
  - python=3.10.12
  - pip=25.2
  - setuptools<81
  - wheel
  - nvidia::cuda-nvcc=12.8
  - gxx_linux-64=12
  - ninja
  - cmake
  - ffmpeg
  - numpy=1.26.4
  - scipy=1.15.2
  - pyyaml=6.0.2
  - pip:
      # PyTorch stopped publishing conda binaries after 2.5. Its official CUDA
      # 12.8 wheels include Blackwell (sm_120) support for the RTX 5090.
      - https://download.pytorch.org/whl/cu128/torch-2.7.1%2Bcu128-cp310-cp310-manylinux_2_28_x86_64.whl
      - https://download.pytorch.org/whl/cu128/torchvision-0.22.1%2Bcu128-cp310-cp310-manylinux_2_28_x86_64.whl
      # Hugging Face stack. These are mutually compatible release versions.
      - accelerate==1.9.0
      - diffusers==0.38.0
      - transformers==4.57.1
      - huggingface-hub==0.36.0
      - tokenizers==0.22.1
      - safetensors==0.8.0
      - peft==0.17.1
      # Core numerical and vision dependencies.
      - einops==0.8.1
      - omegaconf==2.3.0
      - hydra-core==1.3.2
      - open3d==0.18.0
      - opencv-contrib-python==4.10.0.84
      - scikit-learn==1.7.1
      - kornia==0.8.1
      - torchmetrics==1.8.0
      - imageio==2.37.0
      - imageio-ffmpeg==0.6.0
      - matplotlib==3.10.5
      - tqdm==4.67.1
      - plyfile==1.1.2
      - timm==1.0.19
      - torchsde==0.2.6
      - ftfy==6.3.1
      - roma==1.5.4
      - gsplat==1.5.3
      # UI and Fooocus runtime dependencies.
      - gradio==5.41.0
      - gradio-client==1.11.0
      - onnxruntime==1.22.1
      - psutil==7.0.0
      - pillow==10.4.0
      - pillow-heif==0.18.0
